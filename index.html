<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login page</title>

    <style>
        html,body{
            width: 100%;
            height: 100%;
            box-sizing: border-box;
            overflow: hidden;
        }
        *{
            padding: 0;
            margin: 0;
        }

        .parent{
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: space-around;
            align-items: center;  
        }
        .grid{
            display: grid;
            grid-template-columns: 45% 55%;
            grid-template-rows: 1fr;
            grid-column-gap: 0px;
            grid-row-gap: 0px; 
        }


        .sidebar-left{
            background-image: url('storage/img.jpeg');
            min-height: 100%;
            
            background-position: top center;
            background-repeat: no-repeat;
            background-size: cover;
            object-fit: cover;
            margin-right: -1;
            background-color: red;
        }
        img{
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .header{
            text-align: start;
            display: flex;
            flex-wrap: wrap;
            overflow: hidden;
            justify-content: center;
            align-items: flex-start;
            word-break: normal;
            font-weight: bolder;
            font-size: 16px;
        }

        .sidebar-right{
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            flex-direction: column;
            box-sizing: border-box;
            flex-wrap: wrap;
          
            
            box-sizing: border-box;
            padding: 1rem 2rem;
        }

        .input-prnt{
            box-sizing: border-box;
            margin-top: 1.3rem;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            flex-direction: column;   
            background-color: white;
            -webkit-box-shadow: 5px 5px 15px 0px #000000; 
            box-shadow: 5px 5px 15px 0px #000000;
            padding: 0 2rem;
            margin-bottom: 3px;
        }
         .input{
            display: flex;
            justify-content: center;
            align-items: flex-start;
            margin: 2rem 0;
           
            
        } 
        .yapping{
            margin-right: 2.5rem;
            padding: 12px 3rem;
            border: 1px solid black;
            border-radius: 8px;
            gap: 8px;
            row-gap: 6px;
            font-weight: bolder;
            
        }

        .btn-prnt{
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 9px 2px;
            gap: 12px;
        }
        .child-a{
            display: flex;
            justify-content: center;
            align-items: center;
        }
        a{
            color: green;
            margin: 8px;
            text-decoration: underline;
            cursor: pointer;
        }
        .btn{
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px 15px;
            font-weight: bold;
            background-color: aqua;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    
    <div class="parent grid">


        <div class="sidebar-left">  
                <div class="child-sidebar">

                </div>
        </div>


        <div class="sidebar-right"> 

            <div class="header">
                <h2> 
                     This is not a real online service!
                     You know you need something like this in
                     your life to help you realize your deepest dreams.
                     Sign up now to get started.
                     <br>
                </h2>
            </div> 


           <div class="input-prnt">

                <div class="input">
                    <input class="yapping" type="text" placeholder="Username">
                    <input class="yapping" type="password" placeholder="Password">  
                </div>

                <div class="input">
                    <input class="yapping" type="email" name="email" placeholder="Email">
                    <input class="yapping" type="password" name="password" placeholder="Password">
                </div>    

                <div class="input">
                    <input class="yapping" type="tel" name="phone" placeholder="Phone">
                    <input class="yapping" type="text" name="address" placeholder="Address">
                </div>
           </div>

            <div class="btn-prnt">
               <button class="btn">create account</button>
                    <div class="child-a">
                        <p>have an account?</p> 
                        <a>log in</a>
                    </div>
            </div>           

        </div>
    </div>
</body>
</html>
